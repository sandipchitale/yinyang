<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yin Yang Gimbal Visualization</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family: "Inter", sans-serif;
        color: #ffffff;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        pointer-events: auto;
      }
      h1 {
        margin: 0 0 15px 0;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .control-item {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      input[type="checkbox"] {
        accent-color: #4caf50;
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      label {
        font-size: 0.9rem;
        cursor: pointer;
        user-select: none;
      }
      #status {
        margin-top: 15px;
        font-size: 0.8rem;
        color: #888;
        font-style: italic;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.5rem;
        font-weight: bold;
        color: #4caf50;
        pointer-events: none;
      }
    </style>
    <!-- Import maps polyfill -->
    <script
      async
      src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"
    ></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="loading">Loading Models...</div>
    <div id="info">
      <h1>Yin Yang Gimbal</h1>
      <div class="control-group">
        <div class="control-item">
          <input type="checkbox" id="toggle-yin" checked />
          <label for="toggle-yin">Show Yin Rotor</label>
        </div>
        <div class="control-item">
          <input type="checkbox" id="toggle-yang" checked />
          <label for="toggle-yang">Show Yang Rotor</label>
        </div>
        <div class="control-item">
          <input type="checkbox" id="toggle-frame-left" checked />
          <label for="toggle-frame-left">Show Left Frame</label>
        </div>
        <div class="control-item">
          <input type="checkbox" id="toggle-frame-right" checked />
          <label for="toggle-frame-right">Show Right Frame</label>
        </div>
        <div class="control-item">
          <input type="checkbox" id="toggle-anim" checked />
          <label for="toggle-anim">Animate (Click Model to Toggle)</label>
        </div>
      </div>
      <div id="status">Click anywhere on the model to pause/resume.</div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { STLLoader } from "three/addons/loaders/STLLoader.js";

      // Scene Setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);
      // Add some fog for depth
      scene.fog = new THREE.Fog(0x1a1a1a, 20, 100);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(30, 20, 30);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Controls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const backLight = new THREE.DirectionalLight(0x445566, 1);
      backLight.position.set(-10, 5, -10);
      scene.add(backLight);

      // Materials
      const materialYin = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.4,
        metalness: 0.1,
      });
      const materialYang = new THREE.MeshStandardMaterial({
        color: 0x222222,
        roughness: 0.4,
        metalness: 0.1,
      });
      const materialFrame = new THREE.MeshStandardMaterial({
        color: 0x888888,
        roughness: 0.7,
        metalness: 0.5,
      });

      // Groups for rotation
      const yinGroup = new THREE.Group();
      const yangGroup = new THREE.Group();
      const frameGroup = new THREE.Group();
      // Initial rotation handled by animation loop now
      scene.add(yinGroup);
      scene.add(yangGroup);
      scene.add(frameGroup);

      // Loaders
      const loader = new STLLoader();
      let loadedCount = 0;
      const totalModels = 4;

      function checkLoaded() {
        loadedCount++;
        if (loadedCount === totalModels) {
          document.getElementById("loading").style.display = "none";
          animate();
        }
      }

      function loadSTL(path, material, group, name) {
        loader.load(
          path,
          function (geometry) {
            // Center the geometry if needed, but for this assembly we trust the export coordinates
            // geometry.center();

            // Compute normals for smooth shading
            geometry.computeVertexNormals();

            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = name;

            // Fix rotation if needed (JSCAD exports might be different axis)
            // Usually JSCAD is Z-up, Three.js is Y-up.
            // But let's see how it loads first. If it's lying flat, we might need to rotate the whole scene or camera.
            // The camera is at (30, 20, 30) looking at (0,0,0), so Z-up models will look "up".

            group.add(mesh);
            checkLoaded();
          },
          undefined,
          function (error) {
            console.error("Error loading " + path, error);
            document.getElementById("loading").textContent =
              "Error loading models";
          }
        );
      }

      // Load Models
      // Assuming files are in the same directory
      loadSTL("./yin.stl", materialYin, yinGroup, "yin");
      loadSTL("./yang.stl", materialYang, yangGroup, "yang");
      loadSTL("./frame_left.stl", materialFrame, frameGroup, "frame_left");
      loadSTL("./frame_right.stl", materialFrame, frameGroup, "frame_right");

      // Animation State
      let isAnimating = true;
      const rotationSpeed = 0.01;
      let yangPhase = 0; // 0 degrees default

      // UI Logic
      document.getElementById("toggle-yin").addEventListener("change", (e) => {
        yinGroup.visible = e.target.checked;
      });
      document.getElementById("toggle-yang").addEventListener("change", (e) => {
        yangGroup.visible = e.target.checked;
      });
      document
        .getElementById("toggle-frame-left")
        .addEventListener("change", (e) => {
          const mesh = frameGroup.children.find((c) => c.name === "frame_left");
          if (mesh) mesh.visible = e.target.checked;
        });
      document
        .getElementById("toggle-frame-right")
        .addEventListener("change", (e) => {
          const mesh = frameGroup.children.find(
            (c) => c.name === "frame_right"
          );
          if (mesh) mesh.visible = e.target.checked;
        });

      const animToggle = document.getElementById("toggle-anim");
      animToggle.addEventListener("change", (e) => {
        isAnimating = e.target.checked;
        document.getElementById("status").textContent = isAnimating
          ? "Animation running..."
          : "Animation paused.";
      });

      // Click to toggle
      window.addEventListener("mousedown", (event) => {
        // Only toggle if not clicking on UI
        if (event.target.closest("#info")) return;

        isAnimating = !isAnimating;
        animToggle.checked = isAnimating;
        document.getElementById("status").textContent = isAnimating
          ? "Animation running..."
          : "Animation paused.";
      });

      // Resize Handler
      window.addEventListener("resize", onWindowResize, false);
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // Animation Loop
      function animate() {
        requestAnimationFrame(animate);

        if (isAnimating) {
          // Rotate Yin around Z axis
          yinGroup.rotation.z += rotationSpeed;

          // Rotate Yang around X axis (it was rotated 90deg X in generation)
          // Wait, the Yang part is already rotated in the STL.
          // If we want to rotate it "in place", we need to know its axis.
          // In the JSCAD code: yang3D = rotateX(Math.PI / 2, yang3D);
          // So its axis of rotation is now the Y axis (relative to world) or it's still its local Z?
          // Actually, if it was constructed flat and then rotated X 90, its "face" is now on XZ plane? No, XY rotated X 90 -> XZ.
          // So its axis is Y.
          // Let's try rotating around Y.

          // However, for the gimbal mechanism, they usually rotate orthogonally.
          // Yin rotates around Z (blue).
          // Yang rotates around X (red).

          // Since the STL for Yang is already transformed, we might need to rotate it around the global axis that corresponds to its local axis.
          // If it was rotated 90 deg around X, its local Z is now global -Y (or +Y).
          // Let's try rotating Yang around X.

          // Actually, looking at the code:
          // yang3D = rotateX(Math.PI / 2, yang3D);
          // This means the geometry is baked in that orientation.
          // To rotate it "around its axle", we need to rotate around the X axis (if the axle is aligned with X).
          // Let's try rotating the group around X.

          // Wait, if I rotate the group, I rotate the whole mesh.
          // If the mesh is centered at origin, rotating the group around X should work.

          // Synchronization:
          // Usually one rotates +speed, the other -speed or same speed depending on the gear.
          // Let's do both +speed for now.

          // Rotate Yin around Z axis
          yinGroup.rotation.z += rotationSpeed;

          // Rotate Yang around Y axis
          // Apply phase and direction
          // We need to track accumulated rotation for Yang separately if we want to change direction smoothly?
          // Or just base it on Yin's rotation?
          // Let's base it on Yin's rotation to keep them synced.

          const currentRot = yinGroup.rotation.z;
          const yangRot = -currentRot;
          yangGroup.rotation.y = yangRot + yangPhase;
        }

        controls.update();
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
